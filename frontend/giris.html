<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş · Yemekhane Otomasyonu</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/giris.css">
</head>
<body>
  <main class="kapsayici giris-kapsayici">
    <section class="kart">
      <h1>Yemekhane Otomasyonu</h1>

      <!-- Giriş yapılmamışsa görünür -->
      <form id="giris-formu" novalidate>
        <p class="alt">Hesabınızla giriş yapın.</p>

        <div class="alan">
          <label for="eposta">E-posta</label>
          <input id="eposta" name="eposta" type="email" autocomplete="username" required>
        </div>
        <div class="alan">
          <label for="sifre">Şifre</label>
          <input id="sifre" name="sifre" type="password" autocomplete="current-password" required>
        </div>

        <p id="giris-hata" class="bildirim bildirim-hata" role="alert" hidden></p>
        <button id="giris-dugme" class="dugme tam" type="submit">Giriş yap</button>
      </form>

      <!-- Giriş yapılmışsa görünür -->
      <div id="oturum-kutusu" hidden>
        <p class="bildirim bildirim-basari" role="status">
          Hoş geldiniz, <strong id="kullanici-adi"></strong> (<span id="kullanici-rol"></span>).
        </p>
        <a class="dugme tam menuye-git" href="/menu.html">Menüye git</a>
        <button id="cikis-dugme" class="dugme tam" type="button">Çıkış yap</button>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/giris.js"></script>
</body>
</html>
